openapi: 3.0.3
info:
  title: MIRTO DynAA API
  description: |-
    This API offers an interface to the DynAA service. It takes descriptions of application service
    chains, and provides simulation results on the system performance
  contact:
    email: coen.vanleeuwen@tno.nl
  version: v1
servers:
  - url: 'http://myrtus.hesi.energy:5000/dynaa'
paths:
  /simulation:
    post:
      summary: Run a simulation
      description: Runs a simulation of the provided MIRTO-DynAA model, and return KPIs
      operationId: simulation.post
      requestBody:
        description: The MIRTO-DynAA model of the application service chain
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/service_chain'
            examples:
              Myrtus Helmond traffic use case:
                externalValue: "example-uc-traffic.yaml"
              Myrtus face detection application:
                externalValue: "example-myrtusface.yaml"
        required: true
      responses:
        '200':
          description: KPIs as requested in the model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kpi_list'
        '400':
          description: Invalid input
      security:
        - apiAuth: []

components:
  securitySchemes:
    apiAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      # x-apikeyInfoFunc: mirto.api.security.authenticate
  schemas:
    data_size:
      type: string
      description: Amount of memory
      pattern: '^([1-9]\d{0,9}(\.\d{1,3})?|0\.\d{1,3}) ([GM]i?|k|Ki)?B$'
    duration:
      type: string
      description: Absolute time duration
      pattern: '^([1-9]\d{0,9}(\.\d{1,3})?|0\.\d{1,3}) [mun]?s$'
    throughput:
      type: string
      description: Speed of data transmission
      pattern: '^([1-9]\d{0,9}(\.\d{1,3})?|0\.\d{1,3}) ([TGMK]i?)?[Bb]ps$'
    frequency:
      type: string
      description: Frequency in Herz
      pattern: '^([1-9]\d{0,9}(\.\d{1,3})?|0\.\d{1,3}) [TGMk]?Hz$'
    service_chain:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name of the application service chain
        description:
          type: string
          description: A free form field to put a human readable description of this service chain
        version:
          type: string
          description: The version of the application chain
        computes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/compute'
        networks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/network'
        software components:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/software_component'
    compute:
      type: object
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          description: The id of the node
        description:
          type: string
          description: A free form field to put a human readable description
        cpus:
          type: integer
          description: Number of CPUs in this node
          minimum: 1
        cpu_speed:
          $ref: '#/components/schemas/frequency'
        mem:
          $ref: '#/components/schemas/data_size'
        disk:
          $ref: '#/components/schemas/data_size'
    network:
      type: object
      required:
        - peers
        - bandwidth
        - latency
      additionalProperties: false
      properties:
        id:
          type: string
          description: The identifier for this network
        description:
          type: string
          description: A free form field to put a human readable description
        peers:
          type: array
          description: The id of the peers in this link. Should refer to ids of computes
          items:
            type: string
        bandwidth:
          $ref: '#/components/schemas/throughput'
        latency:
          $ref: '#/components/schemas/duration'
        local:
          type: boolean
          description: >
            Denotes whether the peers in this link can only access each other, or
            to a global external network.
          default: false
    software_component:
      type: object
      additionalProperties: false
      required:
        - id
        - segments
      properties:
        id:
          type: string
        description:
          type: string
          description: A free form field to put a human readable description
        base_load:
          $ref: '#/components/schemas/load'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/segment'
          minItems: 1
    load:
      type: object
      description: 'Defines the memory, CPU and/or duration of a task or segment.'
      additionalProperties: false
      properties:
        memory:
          $ref: '#/components/schemas/data_size'
        cpu_load:
          type: number
        duration:
          $ref: '#/components/schemas/duration'
    segment:
      type: object
      additionalProperties: false
      required:
        - id
        - stops_after
      properties:
        id:
          type: string
        description:
          type: string
          description: A free form field to put a human readable description
        load:
          $ref: '#/components/schemas/load'
        emits:
          type: object
          additionalProperties: false
          properties:
            size:
              $ref: '#/components/schemas/data_size'
            target:
              description: >
                The id of the segment that will receive this data. Either a single string with the
                segment ID, or an array of multiple IDs must be provided.
              anyOf:
                - type: string
                - type: array
                  items:
                    type: string
                  minItems: 1
            when:
              type: string
              description: When the emission takes place
              enum:
                - on_start
                - on_finish
        stops_after:
          type: object
          description: >
            The end conditions of a segment in absolute time, in CPU cycles, or in both. When both
            elements are given, the sum of both applies. Alternatively an "event" may trigger the
            end of a segment, which is currently possible by having another segment send data to it.
          additionalProperties: false
          properties:
            time:
              $ref: '#/components/schemas/duration'
            cycles:
              type: integer
            event:
              type: boolean
          minProperties: 1
    channel:
      type: object
      additionalProperties: false
      required:
        - peers
      properties:
        id:
          type: string
        description:
          type: string
          description: A free form field to put a human readable description
        peers:
          type: array
          description: The ids of the peers in this channel. Should refer to ids of segments
          minItems: 2
          items:
            type: string
    kpi_list:
      type: array
      items:
        type: object
