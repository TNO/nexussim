[build-system]
requires = ["setuptools>=46.1.0", "setuptools_scm[toml]>=5"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

[project]
name = "nexussim"
description = "NexusSim is a cutting-edge simulator designed to assess the performance of applications deployed across the cloud-fog-edge nexus. It empowers researchers and developers to model, analyze, and optimize interactions in distributed systems, uncovering insights into resource usage and application behavior across all layers of the computing continuum."
authors = [{name = "Julio de Oliveira Filho en Coen van Leeuwen", email = "julio.deoliveirafilho@tno.nl"}]
license = {text = "Proprietary"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
requires-python = ">=3.10"
dependencies = [
    'importlib-metadata;  python_version>="3.11"',
    "polars>=1.18",
    "ulid>=1.1",
    "pyyaml==6.0.2",
    "pytimeparse==1.1.8",
    "numpy>=2.2",
    "Pint>=0.24",
    "jsonschema>=4.23",
    "influxdb-client[ciso]>=1.49",
    "pydynaa",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst; charset=UTF-8"

[project.urls]
Homepage = "https://ci.tno.nl/gitlab/myrtus/dynaa-sam/nexussim"

[project.optional-dependencies]
testing = [
    "setuptools",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14",
    "ruff>=0.15"
]

[project.entry-points]
# Add here console scripts like:

[tool.setuptools]
zip-safe = false
include-package-data = true
package-dir = {"" = "src"}
platforms = ["any"]
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]
namespaces = true

[tool.pytest.ini_options]
addopts = """
--cov nexussim --cov-report term-missing
--verbose"""
norecursedirs = [
    "dist",
    "build",
]
testpaths = ["tests"]

[tool.devpi.upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = "1"
formats = "bdist_wheel"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Core rules + useful extras
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # import sorting (isort)
    "UP",  # pyupgrade
]

# Optional: ignore rules you don’t care about
ignore = [
    "E203",  # whitespace before ':', conflicts with formatter
    "E203",
    "D203",  # docstring conflicts
    "D212",
]

# Allow autofix for everything possible
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = "4.6"
package = "nexussim"
extensions = """
gitlab
pre_commit"""
