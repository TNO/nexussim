name: TestScene3
version: v0.1
computes:
  - id: a_computer
    description: Describes a computing node
    cpus: 8
    cpu_speed: 800 MHz
    mem: 1 GB

software components:
  - id: test_task
    segments:
      - repeat:
          n_times: 4
          segments:
            - id: test_task_1
              load:
                cpu_load: 1.5
                memory: 1 MB
              stops_after:
                cycles: 10000
            - id: test_task_2
              load:
                cpu_load: 0.5
                memory: 512 KB
              stops_after:
                time: 1s
